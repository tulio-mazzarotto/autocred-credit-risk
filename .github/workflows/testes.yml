name: testes

on:
  push:
  pull_request:

jobs:
  testes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
      - name: Instalar dependências
        run: |
          pip install -r requirements.txt
          pip install -e .
      - name: Rodar os testes
        run: pytest -q
